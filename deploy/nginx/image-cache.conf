# Cache for /_next/image responses. Installed as /etc/nginx/conf.d/image-cache.conf
# (http context). Used by the /_next/image location in s3-assets.conf.
#
# Without it every request goes through Node, which re-checks its own cache and
# re-encodes on a miss; Cloudflare does not cache /_next/image by default.
proxy_cache_path /var/cache/nginx/next-image levels=1:2 keys_zone=next_image:10m
                 max_size=1g inactive=30d use_temp_path=off;

# The optimizer picks the output format from the Accept header, so key on the
# format it will choose rather than on the full (browser-specific) header.
map $http_accept $next_image_fmt {
  default     orig;
  ~*image/avif avif;
  ~*image/webp webp;
}
