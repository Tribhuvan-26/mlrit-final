# Static files from public/ are served from S3 (s3://mlrit-website-assets/site/).
# Anything missing in S3 falls back to the Next.js app (local copy).
location ~* ^/(?!_next/|api/|admin/).+\.(jpe?g|png|gif|svg|webp|avif|ico|pdf|mp4|webm|mov|docx?|xlsx?|pptx?|zip)$ {
  resolver 169.254.169.253 valid=60s ipv6=off;
  set $s3_host mlrit-website-assets.s3.ap-south-1.amazonaws.com;
  rewrite ^(.*)$ /site$1 break;
  proxy_pass https://$s3_host;
  proxy_ssl_server_name on;
  proxy_set_header Host $s3_host;
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_hide_header x-amz-id-2;
  proxy_hide_header x-amz-request-id;
  proxy_hide_header x-amz-server-side-encryption;
  proxy_intercept_errors on;
  error_page 403 404 = @nextjs;
  add_header X-Asset-Source s3 always;
}
location @nextjs {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP         $remote_addr;
}

# next/image: the optimizer reads local paths (/images/x.jpg) from the app's own
# disk. Point it at the S3 copy instead so originals come from the bucket too.
# Needs the bucket in images.remotePatterns (next.config.mjs). Remote URLs and
# /_next/* sources pass through unchanged.
location = /_next/image {
  if ($arg_url ~ "^%2F(?!_next%2F)") {
    set $args "url=https%3A%2F%2Fmlrit-website-assets.s3.ap-south-1.amazonaws.com%2Fsite$arg_url&w=$arg_w&q=$arg_q";
  }
  # Needs conf.d/image-cache.conf (proxy_cache_path + $next_image_fmt).
  # $request_uri is the client's original URL, unaffected by the $args rewrite.
  proxy_cache next_image;
  proxy_cache_key "$host$request_uri$next_image_fmt";
  proxy_cache_valid 200 1d;
  # Cache for our own TTL and key on $next_image_fmt (above), not on Vary: Accept.
  proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
  add_header X-Cache-Status $upstream_cache_status always;
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP         $remote_addr;
}
